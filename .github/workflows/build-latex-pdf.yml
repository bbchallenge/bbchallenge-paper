name: Build LaTeX PDF and diff with arXiv Preprint (v1)
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bbchallenge-paper.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bbchallenge-paper.tex
          work_in_root_file_dir: true
          latexmk_shell_escape: true
          texlive_version: 2024

      - name: Install latexpand and latexdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff texlive-extra-utils

      - name: Materialize old tag into ./old
        run: git worktree add --force old arxiv-preprint-v1

      - name: Flatten old and new trees
        run: |
          latexpand --keep-comments bbchallenge-paper.tex > new-flat.tex
          cd old
          latexpand --keep-comments bbchallenge-paper.tex > old-flat.tex

      - name: Generate redline diff with latexdiff
        run: latexdiff old/old-flat.tex new-flat.tex > bbchallenge-paper-diff-with-v1.tex

      - name: Compile diff PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bbchallenge-paper-diff-with-v1.tex
          work_in_root_file_dir: true
          texlive_version: 2024

      - name: Cleanup old worktree
        if: always()
        run: git worktree remove old --force

      - name: Commit and push both PDFs
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            -f bbchallenge-paper.pdf
            -f bbchallenge-paper-diff-with-v1.pdf
          message: "chore(ci): update PDFs (main + diff vs v1)"
          default_author: github_actions
          new_branch: build-paper-pdf
          push: 'origin build-paper-pdf --set-upstream --force'
